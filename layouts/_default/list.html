{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ with .Pages }}
<ul class="page-list">
  {{ range . }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}"> &mdash; {{ .Date.Format "January 2, 2006" }}</time>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
